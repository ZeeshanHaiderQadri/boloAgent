name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # Config files location
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Use the built-in token so the workflow works without a PAT.
          # Note: PRs and releases created with GITHUB_TOKEN do not trigger
          # downstream workflows.
          token: ${{ secrets.GITHUB_TOKEN }}